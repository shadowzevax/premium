name: Update userscript

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    paths: ['premium.patch', '.github/workflows/update.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get upstream TizenTube
        run: git clone --depth 1 https://github.com/reisxd/TizenTube.git upstream

      - name: Apply personal changes
        id: patch
        working-directory: upstream
        run: git apply ../premium.patch

      - name: Build
        working-directory: upstream/mods
        run: |
          export RIXIUS_BUILD="$(git rev-parse --short=7 HEAD)-$(sha256sum ../../premium.patch | cut -c1-7)"
          echo "RIXIUS_BUILD=$RIXIUS_BUILD" >> "$GITHUB_ENV"
          npm ci --no-audit --no-fund
          npm run build
          node --check ../dist/userScript.js

      - name: Publish if changed
        run: |
          mkdir -p rixius/dist/v1
          cp upstream/dist/userScript.js userScript.js
          cp upstream/dist/userScript.js rixius/dist/v1/userScript.js
          if ! grep -q "\"$RIXIUS_BUILD\"" rixius/dist/v1/version.json 2>/dev/null; then
            echo "{\"build\":\"$RIXIUS_BUILD\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > rixius/dist/v1/version.json
          fi
          (cd upstream && git rev-parse HEAD) > upstream-commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add userScript.js upstream-commit.txt rixius
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update userscript (upstream $(cat upstream-commit.txt | cut -c1-7))"
          git push
          # Purge the script first and wait until the CDN serves the new build; only then
          # purge version.json, so the in-app updater never announces a build it can't get.
          CDN=https://cdn.jsdelivr.net/gh/${{ github.repository }}@main
          PURGE=https://purge.jsdelivr.net/gh/${{ github.repository }}@main
          for i in $(seq 1 20); do
            curl -s "$PURGE/userScript.js" > /dev/null
            sleep 45
            if curl -s "$CDN/userScript.js" | grep -aq "$RIXIUS_BUILD"; then echo "script live"; break; fi
          done
          for i in $(seq 1 10); do
            curl -s "$PURGE/rixius/dist/v1/version.json" > /dev/null
            sleep 20
            if curl -s "$CDN/rixius/dist/v1/version.json" | grep -q "$RIXIUS_BUILD"; then echo "version live"; break; fi
          done

      - name: Report patch conflict
        if: failure() && steps.patch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "premium.patch no aplica sobre TizenTube actual" \
            --body "TizenTube cambio y el parche personal necesita actualizarse. La app sigue usando la ultima version buena." || true
